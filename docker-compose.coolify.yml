# Coolify: Base Directory=/, Docker Compose Location=/docker-compose.coolify.yml.
# Deploy from the Git repository. Code is copied into the image at build time;
# do not add a source bind mount over /workspace (it would hide that code).
# This retains the LOCAL DEVELOPMENT stack and its startup/migration commands.
# It fixes missing source files in Coolify; it is not a production configuration.
# Configure production secrets, public URLs and services before public use.
# Keep docker-compose.yml for local bind-mounted development.
services:
  # Runs for existing databases too: entrypoint init scripts only run on empty PGDATA.
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: database
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: simplerdev
      PGCONNECT_TIMEOUT: "10"
    entrypoint: ["psql"]
    command: ["-X", "-v", "ON_ERROR_STOP=1", "--single-transaction", "-f", "/docker-entrypoint-initdb.d/01-extensions.sql"]
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: database
    container_name: simplerdev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simplerdev
    ports:
      - "5432:5432"
    volumes:
      - simplerdev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplerdev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: simplerdev-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    container_name: simplerdev-app
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -lc "bun install --frozen-lockfile &&
      bun scripts/verify-db-target.ts &&
      bunx drizzle-kit migrate &&
      bun scripts/apply-local-manual-migrations.ts &&
      bun dev"
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/simplerdev
      DRIZZLE_DATABASE_URL: postgresql://postgres:postgres@db:5432/simplerdev
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:3030
      REALTIME_INTERNAL_URL: http://realtime:3030
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}
      SD_AGENTS_URL: http://agents:4111
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:?Configure AUTH_SECRET or NEXTAUTH_SECRET in Coolify}}
      AUTH_TRUST_HOST: "true"
      EMAIL_TRANSPORT: mailpit
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      PORT: "3000"
    volumes:
      - simplerdev-app-node-modules:/workspace/node_modules
      - simplerdev-app-next:/workspace/.next
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun --eval \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s

  minio:
    image: minio/minio:latest
    container_name: simplerdev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - simplerdev-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: simplerdev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/simplerdev-media && mc anonymous set download local/simplerdev-media"

  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    container_name: simplerdev-realtime
    restart: unless-stopped
    working_dir: /workspace/packages/realtime-server
    command: sh -lc "bun install --frozen-lockfile && bun src/server.ts"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/simplerdev
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}
      PORT: "3030"
    volumes:
      - simplerdev-realtime-root-node-modules:/workspace/node_modules
      - simplerdev-realtime-node-modules:/workspace/packages/realtime-server/node_modules
    ports:
      - "3030:3030"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun --eval \"fetch('http://localhost:3030/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s

  agents:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    container_name: simplerdev-agents
    restart: unless-stopped
    working_dir: /workspace/simplerdevelopment-agents
    command: sh -lc "bun install --frozen-lockfile && { [ -f .mastra/output/index.mjs ] && echo 'reusing existing .mastra/output build' || bun run build; } && bun run start"
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      SD_MCP_URL: http://app:3000/api/mcp
      PORT: "4111"
    volumes:
      - simplerdev-agents-node-modules:/workspace/simplerdevelopment-agents/node_modules
    ports:
      - "4111:4111"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun --eval \"fetch('http://localhost:4111').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s

volumes:
  simplerdev-pgdata:
  simplerdev-app-node-modules:
  simplerdev-app-next:
  simplerdev-realtime-root-node-modules:
  simplerdev-realtime-node-modules:
  simplerdev-agents-node-modules:
  simplerdev-minio-data:
