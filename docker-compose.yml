services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: database
    container_name: simplerdev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simplerdev
    ports:
      - '5435:5432'
    volumes:
      - 'simplerdev-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postgres -d simplerdev'
      interval: 5s
      timeout: 5s
      retries: 10
  litellm:
    image: 'ghcr.io/berriai/litellm:main-stable'
    container_name: simplerdev-litellm
    restart: unless-stopped
    command: '--config /litellm-config.yaml --port 4000'
    configs:
      -
        source: litellm-config
        target: /litellm-config.yaml
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    ports:
      - '127.0.0.1:4100:4000'
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:4000/health/liveliness'', timeout=5).status==200 else 1)" || exit 1'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: simplerdev-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    container_name: simplerdev-app
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    working_dir: /workspace
    command: "sh -lc \"bun install --frozen-lockfile --linker=hoisted && bun scripts/verify-db-target.ts && bunx drizzle-kit migrate && bun scripts/apply-local-manual-migrations.ts && bun dev\"\n"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      -
        path: .env.local
        required: false
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/simplerdev'
      DRIZZLE_DATABASE_URL: 'postgresql://postgres:postgres@db:5432/simplerdev'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
      NEXT_ALLOWED_DEV_ORIGINS: '${NEXT_ALLOWED_DEV_ORIGINS:-}'
      NEXT_PUBLIC_REALTIME_URL: 'ws://localhost:3031'
      REALTIME_INTERNAL_URL: 'http://realtime:3030'
      REALTIME_JWT_SECRET: '${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}'
      REALTIME_INTERNAL_SECRET: '${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}'
      AUTH_TRUST_HOST: 'true'
      EMAIL_TRANSPORT: mailpit
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: '1025'
      OPENAI_BASE_URL: 'http://host.docker.internal:1234/v1'
      OPENAI_API_KEY: '${LMSTUDIO_API_KEY:-lmstudio-local}'
      ANTHROPIC_BASE_URL: 'http://litellm:4000'
      ANTHROPIC_API_KEY: '${ANTHROPIC_GATEWAY_KEY:-local-anthropic-gateway}'
      AI_MODEL__chat: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__omnichannelReply: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brainAgentSimple: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brainAgentComplex: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brainClassify: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brainPlan: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__nlpParse: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__classifyCrm: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__classifyNotes: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__meetingProcess: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__surveySummary: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__inboundEmail: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__extensionExtract: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__seoRecommendations: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brandingTheme: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brandingMessaging: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brandingRewrite: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__brandingBlockCopy: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__siteBrandingGen: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__blockRestyle: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__deckGen: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__slideGen: 'openai:qwen3-vl-8b-instruct'
      AI_MODEL__slideBatchEdit: 'openai:qwen3-vl-8b-instruct'
      EMBEDDINGS_MODEL: text-embedding-nomic-embed-text-v1.5@f32
      EMBEDDINGS_DIM: '768'
      S3_ENDPOINT: 'http://minio:9000'
      S3_PUBLIC_ENDPOINT: 'http://localhost:9000'
      S3_REGION: us-east-1
      S3_BUCKET_NAME: simplerdev-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      PORT: '3000'
    volumes:
      - 'simplerdev-app-node-modules:/workspace/node_modules'
      - 'simplerdev-app-next:/workspace/.next'
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - 'bun --eval "fetch(''http://localhost:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s
  cron:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    container_name: simplerdev-cron
    restart: unless-stopped
    working_dir: /workspace
    command: 'sh -lc "bun install --frozen-lockfile && bun scripts/cron-runner.ts"'
    depends_on:
      app:
        condition: service_healthy
    env_file:
      -
        path: .env.local
        required: false
    environment:
      CRON_BASE_URL: 'http://app:3000'
    volumes:
      - 'simplerdev-cron-node-modules:/workspace/node_modules'
    healthcheck:
      test:
        - CMD-SHELL
        - 'grep -qa cron-runner /proc/[0-9]*/cmdline 2>/dev/null || exit 1'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1200s
  minio:
    image: 'minio/minio:latest'
    container_name: simplerdev-minio
    restart: unless-stopped
    command: 'server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9011:9001'
    volumes:
      - 'simplerdev-minio-data:/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -f http://localhost:9000/minio/health/live || exit 1'
      interval: 5s
      timeout: 5s
      retries: 10
  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    container_name: simplerdev-realtime
    restart: unless-stopped
    working_dir: /workspace/packages/realtime-server
    command: 'sh -lc "bun install --frozen-lockfile && bun src/server.ts"'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      -
        path: .env.local
        required: false
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/simplerdev'
      REALTIME_JWT_SECRET: '${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}'
      REALTIME_INTERNAL_SECRET: '${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}'
      PORT: '3030'
    volumes:
      - 'simplerdev-realtime-root-node-modules:/workspace/node_modules'
      - 'simplerdev-realtime-node-modules:/workspace/packages/realtime-server/node_modules'
    ports:
      - '3031:3030'
    healthcheck:
      test:
        - CMD-SHELL
        - 'bun --eval "fetch(''http://localhost:3030/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s
volumes:
  simplerdev-pgdata: null
  simplerdev-app-node-modules: null
  simplerdev-cron-node-modules: null
  simplerdev-app-next: null
  simplerdev-realtime-root-node-modules: null
  simplerdev-realtime-node-modules: null
  simplerdev-minio-data: null
configs:
  litellm-config:
    content: "# Anthropic-protocol gateway for the local-AI deployment (mirror of\n# docker/litellm-config.yaml — edit that file, then copy it here).\nmodel_list:\n  - model_name: \"*\"\n    litellm_params:\n      model: openai/qwen3-vl-8b-instruct\n      api_base: http://host.docker.internal:1234/v1\n      api_key: lmstudio-local\nlitellm_settings:\n  drop_params: true\ngeneral_settings:\n  master_key: local-anthropic-gateway"
