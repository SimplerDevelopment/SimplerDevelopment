<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Paths — Multi-Agent Motion Mockup</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  DEV PATHS v2 — multi-agent, all-development motion mockup
  Spec: vault/05 - Feature Specs/Path Visualizations.md (v2 expansion)

  What v2 adds over v1 (per user asks 2026-07-18):
   · MULTIPLE AGENTS on one chart — per-agent presence beacons + colors
   · ALL DEVELOPMENT — node kinds: screen/component/api/schema/service/test
   · COORDINATION — claims (soft file leases), contested-path detection,
     agent-to-agent notes on nodes, negotiated handoff. All replayable.

  Demo story (~85s): three agents build "Saved Cards" end to end.
   wallet-ui (pink) builds the UI lane · payments-api (periwinkle) builds
   API + schema · qa (silver) authors and runs e2e tests.
   ~00:30 both agents need lib/payments/intent.ts → CONTESTED path,
   note exchange, handoff. ~00:58 QA finds a 3DS bug → fix loop → ship.

  Same pure reducer-over-event-log architecture as v1/prod.
  Agent colors validated (dataviz): #FF66C4 / #8FA0FF / #DCE7F0 — and
  agent identity is never color-alone (name chip always attached).
  ═══════════════════════════════════════════════════════════════════════
-->
<style>
  :root {
    --surface: #0C141C;  --panel: #111C26;  --panel-2: #16232F;
    --line: #1F3140;  --line-bright: #2C4356;
    --ink: #E4EDF4;  --ink-2: #93A6B8;  --ink-3: #5C7183;

    --st-planned: #64748B;  --st-scaffolded: #4B8DE0;  --st-wired: #22B8E6;
    --st-styled: #2EDCB4;   --st-tested: #6EE86E;      --st-shipped: #E9F87E;
    --st-blocked: #ECA83D;  --st-error: #F1655A;

    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--surface); color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; }
  .hud { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    position: relative; z-index: 30; display: flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 18px;
    background: color-mix(in oklab, var(--panel) 85%, transparent);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 16px; height: 16px; }
  .crumb { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .crumb .dim { color: var(--ink-3); font-weight: 500; }
  .chip { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-bright); color: var(--ink-2); background: var(--panel-2); white-space: nowrap; }
  .hspace { flex: 1; }
  .evcount { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .evcount b { color: var(--ink-2); font-weight: 600; }
  .agent-chip {
    display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    padding: 4px 9px; border-radius: 20px; white-space: nowrap;
    border: 1px solid color-mix(in oklab, var(--ac) 40%, transparent);
    background: color-mix(in oklab, var(--ac) 9%, transparent);
    transition: opacity .4s ease;
  }
  .agent-chip.idle { opacity: .38; }
  .agent-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 8px var(--ac); }
  .live-badge { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; padding: 5px 12px; border-radius: 4px; cursor: pointer; user-select: none; border: 1px solid transparent; white-space: nowrap; }
  .live-badge.live { color: #6EE86E; border-color: #6ee86e55; background: #6ee86e12; }
  .live-badge.paused { color: var(--st-blocked); border-color: #eca83d55; background: #eca83d12; }
  .live-badge.replay { color: var(--st-wired); border-color: #22b8e655; background: #22b8e612; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .live .live-dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .btn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; border: 1px solid var(--line-bright); background: var(--panel-2); color: var(--ink-2); }
  .btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .btn svg { width: 15px; height: 15px; }

  /* ── Stage ──────────────────────────────────────────────────── */
  #stage { position: relative; flex: 1; overflow: hidden; }
  #viewport {
    position: absolute; inset: 0; overflow: hidden; cursor: grab;
    background:
      radial-gradient(1200px 600px at 50% 120%, #14212cAA 0%, transparent 60%),
      radial-gradient(circle, #1F314055 1px, transparent 1.4px);
    background-size: auto, 26px 26px;
  }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #edgeSvg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  .lane-label { position: absolute; font-family: var(--mono); font-size: 10px; letter-spacing: .3em; color: #33485C; text-transform: uppercase; }

  /* ── Edges ──────────────────────────────────────────────────── */
  .edge-nav { fill: none; stroke: var(--line-bright); stroke-width: 2; stroke-dasharray: 7 5; animation: march 1.1s linear infinite; }
  .edge-nav.lit { stroke: color-mix(in oklab, var(--st-wired) 55%, var(--line-bright)); }
  @keyframes march { to { stroke-dashoffset: -12; } }
  .edge-data { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 4; }
  .edge-data.hot { stroke: color-mix(in oklab, var(--st-wired) 40%, var(--line)); }
  .particle { fill: var(--st-wired); }
  .edge-arrow { fill: var(--line-bright); }

  /* ── Nodes shared ───────────────────────────────────────────── */
  .node { position: absolute; border-radius: 10px; cursor: pointer; transition: box-shadow .3s ease, border-color .3s ease, transform .12s ease, outline-color .3s ease; }
  .node:hover { transform: translateY(-1px); }
  .node.mounting { animation: mount .55s cubic-bezier(.16,1,.3,1) both; }
  @keyframes mount { from { opacity: 0; transform: scale(.75) translateY(8px); filter: blur(4px); } }
  .node.flash { box-shadow: 0 0 0 1px var(--nc), 0 0 28px color-mix(in oklab, var(--nc) 55%, transparent), 0 6px 24px #00000055; }
  .comp.flash { border-color: var(--cc); box-shadow: 0 0 14px color-mix(in oklab, var(--cc) 45%, transparent); }
  .node.err-shake { animation: shake .5s ease both; }
  @keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  /* claims */
  .node.claimed { outline: 2px solid var(--claimc); outline-offset: 4px; }
  .node.contested { outline: 2px dashed var(--st-blocked); outline-offset: 4px; }
  .claim-tag {
    position: absolute; top: -11px; left: 10px; z-index: 3;
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; color: var(--ink-2);
    background: var(--panel-2); border: 1px solid var(--line-bright);
    padding: 2px 7px; border-radius: 8px; white-space: nowrap;
  }
  .claim-tag i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .claim-tag.warn { border-color: color-mix(in oklab, var(--st-blocked) 60%, transparent); color: var(--st-blocked); }

  .note-badge { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 9px; color: var(--ink-3); }
  .note-badge svg { width: 11px; height: 11px; }

  .status-word { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--nc, var(--st-planned)); }
  .ring rect { fill: var(--line); }
  .ring rect.on { fill: var(--nc, var(--st-planned)); }

  /* screens */
  .screen {
    width: 250px; height: 150px;
    background: linear-gradient(180deg, color-mix(in oklab, var(--panel-2) 92%, var(--nc, var(--st-planned))) 0%, var(--panel) 100%);
    border: 1px solid color-mix(in oklab, var(--nc, var(--st-planned)) 45%, var(--line));
    box-shadow: 0 6px 24px #00000055, inset 0 1px 0 #ffffff0d;
  }
  .screen.shipped-fill { background: linear-gradient(180deg, color-mix(in oklab, var(--st-shipped) 16%, var(--panel-2)), var(--panel)); }
  .screen .head { display: flex; align-items: center; gap: 8px; padding: 11px 12px 8px; }
  .screen .title { font-size: 13px; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .route { display: inline-block; margin: 0 12px 8px; font-family: var(--mono); font-size: 10px; color: var(--ink-2); padding: 2px 7px; border-radius: 4px; background: #0009; border: 1px solid var(--line); }
  .chips { padding: 0 10px; display: flex; flex-direction: column; gap: 5px; }
  .comp { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 6px; cursor: pointer; background: #0B131B99; border: 1px solid var(--line); font-size: 11px; color: var(--ink-2); transition: border-color .3s ease; }
  .comp:hover { border-color: var(--ink-3); }
  .comp .cdot { width: 7px; height: 7px; border-radius: 2px; background: var(--cc, var(--st-planned)); flex: none; }
  .comp .cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp .cst { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--cc, var(--st-planned)); }

  /* api nodes */
  .api {
    display: flex; align-items: center; gap: 9px; padding: 0 13px;
    background: color-mix(in oklab, var(--panel-2) 93%, var(--nc, var(--st-planned)));
    border: 1px solid color-mix(in oklab, var(--nc, var(--st-planned)) 42%, var(--line));
    box-shadow: 0 4px 18px #00000048; border-radius: 8px;
  }
  .api .method { font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .08em; color: #0C141C; background: var(--nc, var(--st-planned)); border-radius: 3px; padding: 2px 5px; flex: none; }
  .api .aname { font-family: var(--mono); font-size: 11px; color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* schema nodes */
  .schema {
    padding: 9px 13px;
    background: color-mix(in oklab, var(--panel-2) 93%, var(--nc, var(--st-planned)));
    border: 1px solid color-mix(in oklab, var(--nc, var(--st-planned)) 42%, var(--line));
    border-radius: 8px; box-shadow: 0 4px 18px #00000048;
  }
  .schema .stag { font-family: var(--mono); font-size: 7.5px; letter-spacing: .2em; color: var(--ink-3); }
  .schema .sname { font-family: var(--mono); font-size: 12px; color: var(--ink); margin-top: 2px; display: flex; align-items: center; gap: 8px; }

  /* service + test pills */
  .service, .test {
    display: flex; align-items: center; gap: 9px; padding: 0 12px;
    border: 1px solid color-mix(in oklab, var(--nc, var(--st-planned)) 40%, var(--line));
    background: color-mix(in oklab, var(--panel-2) 94%, var(--nc, var(--st-planned)));
    box-shadow: 0 4px 16px #00000044;
  }
  .service { border-radius: 999px; }
  .test { border-radius: 8px; border-style: dashed; }
  .service svg, .test svg { width: 14px; height: 14px; flex: none; color: var(--nc, var(--st-planned)); }
  .sname { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Beacons (one per agent) ────────────────────────────────── */
  .beacon { position: absolute; width: 0; height: 0; pointer-events: none; transition: transform .7s cubic-bezier(.3,.8,.3,1), opacity .4s ease; z-index: 5; }
  .beacon.hidden { opacity: 0; }
  .radar { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 1.5px solid var(--ac); opacity: 0; animation: radar 2.2s ease-out infinite; }
  .radar:nth-child(2) { animation-delay: .7s; }
  .radar:nth-child(3) { animation-delay: 1.4s; }
  @keyframes radar { 0% { transform: scale(.25); opacity: .8; } 70% { opacity: .18; } 100% { transform: scale(1.6); opacity: 0; } }
  .beacon-core { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 12px var(--ac), 0 0 30px color-mix(in oklab, var(--ac) 60%, transparent); }
  .beacon-tag {
    position: absolute; left: 14px; top: -34px; white-space: nowrap;
    font-family: var(--mono); font-size: 10px; color: var(--ink);
    background: color-mix(in oklab, var(--ac) 14%, #10141aE8);
    border: 1px solid color-mix(in oklab, var(--ac) 45%, transparent);
    padding: 5px 9px; border-radius: 6px; box-shadow: 0 4px 18px #00000066;
  }
  .beacon-tag b { color: var(--ac); font-weight: 700; }

  /* ── Legend ─────────────────────────────────────────────────── */
  #legend { position: absolute; right: 14px; bottom: 74px; z-index: 20; display: flex; flex-direction: column; gap: 6px; padding: 9px 12px; border-radius: 8px; background: color-mix(in oklab, var(--panel) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .lrow { display: flex; gap: 11px; }
  .litem { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .litem i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .litem i.oline { background: transparent; border: 1.5px solid var(--ink-2); }
  .litem i.oline-c { background: transparent; border: 1.5px dashed var(--st-blocked); }

  /* ── Ticker ─────────────────────────────────────────────────── */
  #ticker { position: absolute; left: 14px; bottom: 74px; z-index: 20; display: flex; flex-direction: column-reverse; gap: 4px; pointer-events: none; }
  .tick-line { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; color: var(--ink-2); background: color-mix(in oklab, var(--panel) 80%, transparent); border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; animation: tickin .35s ease both; backdrop-filter: blur(6px); }
  .tick-line .adot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .tick-line .t { color: var(--ink-3); }
  .tick-line .et { color: var(--st-wired); }
  .tick-line.is-err .et { color: var(--st-error); }
  .tick-line.is-conf { border-color: color-mix(in oklab, var(--st-blocked) 50%, transparent); }
  .tick-line.is-conf .et { color: var(--st-blocked); }
  .tick-line.is-note .et { color: #C9B8FF; }
  @keyframes tickin { from { opacity: 0; transform: translateY(8px); } }
  .tick-line.old { opacity: .38; } .tick-line.older { opacity: .16; }

  /* ── Scrubber ───────────────────────────────────────────────── */
  #scrub { position: relative; z-index: 30; display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; background: color-mix(in oklab, var(--panel) 92%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(10px); }
  #playBtn { width: 34px; height: 34px; border-radius: 50%; }
  .timewrap { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  #track { position: relative; height: 22px; cursor: pointer; }
  #track .rail { position: absolute; left: 0; right: 0; top: 10px; height: 3px; border-radius: 2px; background: var(--line); }
  #track .fill { position: absolute; left: 0; top: 10px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--st-scaffolded), var(--st-wired), var(--st-styled)); }
  #track .etick { position: absolute; top: 7px; width: 2px; height: 9px; border-radius: 1px; background: var(--line-bright); }
  #track .etick.is-status { background: color-mix(in oklab, var(--st-styled) 70%, var(--line-bright)); }
  #track .etick.is-err { background: var(--st-error); }
  #track .etick.is-conf { background: var(--st-blocked); height: 12px; top: 5px; }
  #track .playhead { position: absolute; top: 3px; width: 3px; height: 17px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 8px #ffffff66; margin-left: -1px; }
  .timelabels { display: flex; justify-content: space-between; }
  #speed { display: flex; gap: 3px; }
  .spd { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer; color: var(--ink-3); border: 1px solid transparent; }
  .spd.on { color: var(--ink); border-color: var(--line-bright); background: var(--panel-2); }

  /* ── Inspector ──────────────────────────────────────────────── */
  #inspector { position: absolute; top: 0; right: 0; bottom: 0; width: 330px; z-index: 25; background: color-mix(in oklab, var(--panel) 96%, transparent); border-left: 1px solid var(--line); backdrop-filter: blur(14px); transform: translateX(350px); transition: transform .35s cubic-bezier(.3,.9,.3,1); display: flex; flex-direction: column; }
  #inspector.open { transform: translateX(0); }
  .insp-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .insp-title { font-size: 15px; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .insp-body { flex: 1; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
  .insp-sec .hud { margin-bottom: 7px; }
  .kv { display: grid; grid-template-columns: 86px 1fr; gap: 4px 10px; font-size: 11.5px; }
  .kv .k { color: var(--ink-3); font-family: var(--mono); font-size: 10px; padding-top: 1px; }
  .kv .v { color: var(--ink-2); font-family: var(--mono); font-size: 10.5px; word-break: break-word; }
  .kv .v.code { color: #A8D3EE; }
  .insp-status-row { display: flex; align-items: center; gap: 10px; }
  .call-row { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 5px; background: #0009; }
  .call-row svg { width: 12px; height: 12px; color: var(--st-wired); flex: none; }
  .hist-row { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); padding: 3px 0; }
  .hist-row .adot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .hist-row .hv { color: var(--ink-2); }
  .claim-card { border: 1px solid var(--line-bright); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; background: #0009; }
  .claim-card .crow { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--ink); }
  .claim-card .crow i { width: 7px; height: 7px; border-radius: 50%; }
  .claim-card .cintent { font-size: 11px; color: var(--ink-2); margin-top: 4px; }
  .claim-card .cfiles { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); margin-top: 5px; line-height: 1.5; }
  .contested-banner { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--st-blocked); border: 1px dashed color-mix(in oklab, var(--st-blocked) 55%, transparent); border-radius: 6px; padding: 6px 9px; margin-bottom: 7px; }
  .note-row { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .note-row:last-child { border-bottom: none; }
  .note-row .adot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 3px; }
  .note-row .nbody { flex: 1; }
  .note-row .nwho { font-family: var(--mono); font-size: 9px; color: var(--ink-3); margin-bottom: 2px; }
  .note-row .nwho b { color: var(--ink-2); }
  .note-row .ntext { font-size: 11px; color: var(--ink-2); line-height: 1.45; }
  .test-ok { color: var(--st-tested); } .test-none { color: var(--ink-3); }

  /* ── End card ───────────────────────────────────────────────── */
  #endcard { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #060b10CC; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #endcard.show { opacity: 1; pointer-events: auto; }
  .endbox { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .endbox .big { font-size: 22px; font-weight: 700; }
  .endbox .stats { font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: .08em; }

  @media (prefers-reduced-motion: reduce) {
    .radar, .live .live-dot { animation: none !important; }
    .edge-nav { animation: none !important; }
    .particle { display: none; }
    .node.mounting { animation-duration: .01s; }
    .beacon { transition: none; }
  }
</style>
</head>

<header>
  <div class="brand" title="Dev Paths">
    <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h3M11 8h3" stroke="#22B8E6" stroke-width="1.5"/><rect x="5" y="5" width="6" height="6" rx="1.5" stroke="#22B8E6" stroke-width="1.5"/><circle cx="2" cy="8" r="1.4" fill="#FF66C4"/><circle cx="14" cy="8" r="1.4" fill="#22B8E6"/></svg>
    <span class="hud" style="color:#8FB6CE">Dev Paths</span>

/* ═══════════════ 4 · PURE REDUCER ═══════════════ */
function stateAt(T) {
  const s = { nodes: new Map(), edges: [], presence: new Map(), claims: new Map(), notes: new Map(), applied: 0, lastByNode: new Map(), noteCount: 0, conflicts: 0 };
  for (const e of EVENTS) {
    if (e.t > T) break;
    s.applied++;
    if (e.type === 'node.upserted') {
      s.nodes.set(e.key, {
        key: e.key, kind: e.kind, label: e.label, parent: e.parent || null,
        route: e.route || null, file: e.file || null, domain: e.domain || null,
        method: e.method || null, cols: e.cols || null,
        status: 'planned', lastStep: 1, statusAt: e.t, bornAt: e.t, note: null,
        meta: {}, history: [{ t: e.t, status: 'planned', agent: e.agent }],
      });
    } else if (e.type === 'node.status') {
      const n = s.nodes.get(e.key);
      if (n) {
        n.status = e.status; n.statusAt = e.t; n.note = e.note || n.note;
        if (STATUS[e.status].step > 0) n.lastStep = STATUS[e.status].step;
        n.history.push({ t: e.t, status: e.status, agent: e.agent });
      }
    } else if (e.type === 'node.meta') {
      const n = s.nodes.get(e.key);
      if (n) { Object.assign(n.meta, e.meta); }
    } else if (e.type === 'edge.upserted') {
      s.edges.push({ from: e.from, to: e.to, kind: e.kind, label: e.label, bornAt: e.t });
    } else if (e.type === 'agent.touch') {
      s.presence.set(e.agent, { key: e.key, action: e.action, t: e.t });
      s.lastByNode.set(e.key, e.t);
    } else if (e.type === 'claim') {
      const list = s.claims.get(e.key) || [];
      list.push({ agent: e.agent, intent: e.intent, files: e.files, t: e.t });
      s.claims.set(e.key, list);
    } else if (e.type === 'release') {
      const list = (s.claims.get(e.key) || []).filter(c => c.agent !== e.agent);
      if (list.length) s.claims.set(e.key, list); else s.claims.delete(e.key);
    } else if (e.type === 'note') {
      const list = s.notes.get(e.key) || [];
      list.push({ agent: e.agent, text: e.text, t: e.t });
      s.notes.set(e.key, list);
      s.noteCount++;
    } else if (e.type === 'conflict') {
      s.conflicts++;
    }
  }
  return s;
}

/* ═══════════════ 5 · GEOMETRY ═══════════════ */
function nodeRect(n) { return POS[n.key] || null; }
function worldPosOf(state, key) {
  const n = state.nodes.get(key);
  if (!n) return null;
  const r = POS[key];
  if (r) {
    return n.kind === 'screen' ? { x: r.x + 14, y: r.y + 20 } : { x: r.x + 16, y: r.y + r.h / 2 };
  }
  if (n.parent && POS[n.parent]) {
    const siblings = [...state.nodes.values()].filter(m => m.parent === n.parent);
    const idx = siblings.findIndex(m => m.key === key);
    const pp = POS[n.parent];
    return { x: pp.x + 16, y: pp.y + 90 + idx * 31 };
  }
  return null;
}
function edgePath(a, b, kind) {
  const acx = a.x + a.w / 2, acy = a.y + a.h / 2, bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  if (kind === 'nav' || Math.abs(bcx - acx) > Math.abs(bcy - acy) * 1.6) {
    const ltr = bcx > acx;
    const x1 = ltr ? a.x + a.w : a.x, y1 = acy, x2 = ltr ? b.x : b.x + b.w, y2 = bcy;
    const dx = Math.max(50, Math.abs(x2 - x1) / 2) * (ltr ? 1 : -1);
    return { d: `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`, end: { x: x2, y: y2, ltr } };
  }
  const down = bcy > acy;
  const y1 = down ? a.y + a.h : a.y, y2 = down ? b.y : b.y + b.h;
  const dy = Math.max(34, Math.abs(y2 - y1) / 2) * (down ? 1 : -1);
  return { d: `M ${acx} ${y1} C ${acx} ${y1 + dy}, ${bcx} ${y2 - dy}, ${bcx} ${y2}`, end: null };
}

  let r = `<svg class="ring" width="34" height="8" viewBox="0 0 34 8">`;
  for (let i = 0; i < 6; i++) r += `<rect x="${i * 6}" y="1" width="4" height="6" rx="1" class="${i < step ? 'on' : ''}"/>`;
  return r + '</svg>';
}
function noteBadge(state, key) {
  const c = (state.notes.get(key) || []).length;
  return c ? `<span class="note-badge">${ICONS.chat}${c}</span>` : '';
}
function claimTag(state, key) {
  const claims = state.claims.get(key) || [];
  if (!claims.length) return '';
  if (claims.length > 1) {
    const dots = claims.map(c => `<i style="background:${AGENTS[c.agent].color}"></i>`).join('');
    return `<span class="claim-tag warn">${dots} contested</span>`;
  }
  const c = claims[0];
  return `<span class="claim-tag"><i style="background:${AGENTS[c.agent].color}"></i>${c.agent}</span>`;
}

function renderGraph(state, T) {
  // edges
  edgeSvg.innerHTML = '';
  for (const e of state.edges) {
    const a = state.nodes.get(e.from), b = state.nodes.get(e.to);
    if (!a || !b) continue;
    const ra = nodeRect(a), rb = nodeRect(b);
    if (!ra || !rb) continue;
    const { d, end } = edgePath(ra, rb, e.kind);
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    const srcHot = (state.lastByNode.get(e.from) ?? -99) > T - 7 ||
      [...state.nodes.values()].some(m => m.parent === e.from && (state.lastByNode.get(m.key) ?? -99) > T - 7);
    p.setAttribute('class', e.kind === 'nav'
      ? 'edge-nav' + (STATUS[a.status].step >= 3 && STATUS[b.status].step >= 3 ? ' lit' : '')
      : 'edge-data' + (srcHot ? ' hot' : ''));
    const age = T - e.bornAt;
    if (age < 0.9) p.style.opacity = String(Math.min(1, age / 0.4));
    edgeSvg.appendChild(p);
    if (e.kind === 'nav' && end) {
      const s = end.ltr ? 1 : -1;
      const ar = document.createElementNS(SVGNS, 'path');
      ar.setAttribute('d', `M ${end.x - 9 * s} ${end.y - 5} L ${end.x - 1 * s} ${end.y} L ${end.x - 9 * s} ${end.y + 5} Z`);
      ar.setAttribute('class', 'edge-arrow');
      edgeSvg.appendChild(ar);
    }
    if (e.kind === 'data' && srcHot) spawnParticles(p, T);
  }

  // nodes
  const seen = new Set();
  for (const n of state.nodes.values()) {
    if (!POS[n.key]) continue;
    seen.add(n.key);
    let el = nodesEl.querySelector(`[data-key="${n.key}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.key = n.key;
      el.addEventListener('click', ev => { ev.stopPropagation(); openInspector(n.key); });
      nodesEl.appendChild(el);
    }
    const st = STATUS[n.status];
    const age = T - n.bornAt, stAge = T - n.statusAt;
    const flash = stAge >= 0 && stAge < 1.0 && n.status !== 'planned';
    const claims = state.claims.get(n.key) || [];
    const cls = ['node', n.kind === 'screen' ? 'screen' : n.kind];
    if (age < 0.6) cls.push('mounting');
    if (flash) cls.push(n.status === 'error' ? 'err-shake flash' : 'flash');
    if (n.status === 'shipped' && n.kind === 'screen') cls.push('shipped-fill');
    if (claims.length > 1) cls.push('contested');
    else if (claims.length === 1) cls.push('claimed');
    el.className = cls.join(' ');
    el.style.setProperty('--nc', st.c);
    if (claims.length === 1) el.style.setProperty('--claimc', AGENTS[claims[0].agent].color);
    const r = nodeRect(n);
    el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
    el.style.width = r.w + 'px'; el.style.height = r.h + 'px';

    const alert = n.status === 'error' || n.status === 'blocked';
    const tag = claimTag(state, n.key);

    if (n.kind === 'screen') {
      const comps = [...state.nodes.values()].filter(m => m.parent === n.key);
      el.innerHTML = `${tag}
        <div class="head">
          <span class="title">${n.label}</span>
          ${noteBadge(state, n.key)}
          ${alert ? `<span style="color:${st.c};width:13px;display:inline-flex">${ICONS.warn}</span>` : ''}
          ${n.status === 'shipped' ? `<span style="color:${st.c};width:13px;display:inline-flex">${ICONS.check}</span>` : ''}
          ${ringSVG(n.lastStep)}
        </div>
        <span class="route">${n.route}</span>
        <div class="hud" style="padding:0 12px 5px;color:${st.c}">${n.status}</div>
        <div class="chips">${comps.map(c => {
          const cst = STATUS[c.status];
          const cFlash = (T - c.statusAt) >= 0 && (T - c.statusAt) < 1.0 && c.status !== 'planned';
          const cn = (state.notes.get(c.key) || []).length;
          return `<div class="comp${cFlash ? ' flash' : ''}" data-comp="${c.key}" style="--cc:${cst.c}">
            <span class="cdot"></span><span class="cname">${c.label}</span>
            ${cn ? `<span class="note-badge">${ICONS.chat}${cn}</span>` : ''}
            <span class="cst">${c.status}</span>
          </div>`;
        }).join('')}</div>`;
      el.querySelectorAll('.comp').forEach(ch =>
        ch.addEventListener('click', ev => { ev.stopPropagation(); openInspector(ch.dataset.comp); }));
    } else if (n.kind === 'api') {
      el.innerHTML = `${tag}<span class="method">${n.method}</span><span class="aname">${n.label}</span>${noteBadge(state, n.key)}${alert ? `<span style="color:${st.c};width:13px;display:inline-flex;flex:none">${ICONS.warn}</span>` : ''}${ringSVG(n.lastStep)}`;
    } else if (n.kind === 'schema') {
      el.innerHTML = `${tag}<div class="stag">TABLE · ${n.cols}</div><div class="sname">${n.label} ${ringSVG(n.lastStep)}</div>`;
    } else if (n.kind === 'service') {
      el.innerHTML = `${tag}${ICONS.cloud}<span class="sname">${n.label}</span>`;
    } else if (n.kind === 'test') {
      el.innerHTML = `${tag}${ICONS.flask}<span class="sname">${n.label}</span>${alert ? `<span style="color:${st.c};width:12px;display:inline-flex;flex:none">${ICONS.warn}</span>` : ''}${ringSVG(n.lastStep)}`;
    }
  }
  for (const el of [...nodesEl.children]) if (!seen.has(el.dataset.key)) el.remove();

  // beacons — one per agent
  const names = Object.keys(AGENTS);
  names.forEach((agent, idx) => {
    let b = beaconsEl.querySelector(`[data-agent="${agent}"]`);
    if (!b) {
      b = document.createElement('div');
      b.className = 'beacon hidden'; b.dataset.agent = agent;
      b.style.setProperty('--ac', AGENTS[agent].color);
      b.innerHTML = `<div class="radar"></div><div class="radar"></div><div class="radar"></div>
        <div class="beacon-core"></div>
        <div class="beacon-tag"><b>${agent}</b> <span class="bact"></span></div>`;
      beaconsEl.appendChild(b);
    }
    const pr = state.presence.get(agent);
    if (pr && T - pr.t < 10) {
      const wp = worldPosOf(state, pr.key);
      if (wp) {
        b.classList.remove('hidden');
        b.style.transform = `translate(${wp.x + idx * 22}px, ${wp.y + idx * 6}px)`;
        b.querySelector('.bact').textContent = '· ' + pr.action;
        return;
      }
    }
    b.classList.add('hidden');
  });

  // header agent chips
  names.forEach(agent => {
    const chip = document.querySelector(`.agent-chip[data-agent="${agent}"]`);
    const pr = state.presence.get(agent);
    chip.classList.toggle('idle', !(pr && T - pr.t < 12));
  });
}

function spawnParticles(pathEl, T) {
  const g = document.createElementNS(SVGNS, 'g');
  const len = pathEl.getTotalLength();
  for (let i = 0; i < 3; i++) {
    const ph = ((T * 0.55) + i / 3) % 1;
    const pt = pathEl.getPointAtLength(ph * len);
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
    c.setAttribute('r', 2.2 - i * 0.4);
    c.setAttribute('class', 'particle');
    c.setAttribute('opacity', String(0.9 - i * 0.25));
    g.appendChild(c);
  }
  edgeSvg.appendChild(g);
}

/* ═══════════════ 7 · INSPECTOR ═══════════════ */
const inspector = $('inspector');
function openInspector(key) { selectedKey = key; inspector.classList.add('open'); renderInspector(stateAt(simT)); }
$('inspClose').addEventListener('click', () => { selectedKey = null; inspector.classList.remove('open'); });
function fmtT(t) { const m = String(Math.floor(t / 60)).padStart(2, '0'), s = String(Math.floor(t % 60)).padStart(2, '0'); return `${m}:${s}`; }

function renderInspector(state) {
  if (!selectedKey) return;
  const n = state.nodes.get(selectedKey);
  if (!n) { inspector.classList.remove('open'); return; }
  $('inspTitle').textContent = n.label;
  const st = STATUS[n.status];
  const tested = ['tested', 'shipped'].includes(n.status);
  const kindLabel = { screen: 'Screen · route', component: 'Component', service: 'External service', api: 'API route', schema: 'DB table', test: 'Test suite' }[n.kind];
  const claims = state.claims.get(n.key) || [];
  const notes = state.notes.get(n.key) || [];
  $('inspBody').innerHTML = `
    <div class="insp-sec">
      <div class="insp-status-row">
        <span class="status-word" style="--nc:${st.c};font-size:11px">${n.status}</span>
        <span style="--nc:${st.c}">${ringSVG(n.lastStep)}</span>
      </div>
      ${n.note ? `<div style="font-family:var(--mono);font-size:10px;color:${n.status === 'error' ? 'var(--st-error)' : 'var(--ink-3)'};margin-top:7px">${n.note}</div>` : ''}
    </div>
    ${claims.length ? `
    <div class="insp-sec">
      <div class="hud">Claims</div>
      ${claims.length > 1 ? `<div class="contested-banner">CONTESTED — ${claims.length} agents want this path</div>` : ''}
      ${claims.map(c => `<div class="claim-card">
        <div class="crow"><i style="background:${AGENTS[c.agent].color}"></i>${AGENTS[c.agent].full}<span style="color:var(--ink-3);margin-left:auto">${fmtT(c.t)}</span></div>
        <div class="cintent">${c.intent}</div>
        <div class="cfiles">${c.files.join('<br>')}</div>
      </div>`).join('')}
    </div>` : ''}
    ${notes.length ? `
    <div class="insp-sec">
      <div class="hud">Notes (${notes.length})</div>
      ${notes.map(no => `<div class="note-row">
        <span class="adot" style="background:${AGENTS[no.agent].color}"></span>
        <div class="nbody"><div class="nwho"><b>${no.agent}</b> · ${fmtT(no.t)}</div><div class="ntext">${no.text}</div></div>
      </div>`).join('')}
    </div>` : ''}
    <div class="insp-sec">
      <div class="hud">Identity</div>
      <div class="kv">
        <span class="k">kind</span><span class="v">${kindLabel}</span>
        ${n.route ? `<span class="k">route</span><span class="v code">${n.route}</span>` : ''}
        ${n.method ? `<span class="k">method</span><span class="v code">${n.method}</span>` : ''}
        ${n.file ? `<span class="k">file</span><span class="v code">${n.file}</span>` : ''}
        ${n.domain ? `<span class="k">domain</span><span class="v">${n.domain}</span>` : ''}
        ${n.parent ? `<span class="k">screen</span><span class="v">${n.parent}</span>` : ''}
      </div>
    </div>
    ${Object.keys(n.meta).length ? `
    <div class="insp-sec">
      <div class="hud">Declared state</div>
      <div class="kv">
        ${n.meta.state ? `<span class="k">state</span><span class="v code">${n.meta.state}</span>` : ''}
        ${n.meta.store ? `<span class="k">store</span><span class="v code">${n.meta.store}</span>` : ''}
        ${n.meta.props ? `<span class="k">props</span><span class="v code">${n.meta.props}</span>` : ''}
      </div>
    </div>` : ''}
    ${n.meta.calls ? `
    <div class="insp-sec">
      <div class="hud">External calls</div>
      ${n.meta.calls.split('·').map(c => `<div class="call-row">${ICONS.cloud}<span>${c.trim()}</span></div>`).join('')}
    </div>` : ''}
    ${n.kind !== 'test' ? `
    <div class="insp-sec">
      <div class="hud">Tests</div>
      <div style="font-family:var(--mono);font-size:10.5px" class="${tested ? 'test-ok' : 'test-none'}">
        ${tested ? '✓ covered' : '— none yet'}
      </div>
    </div>` : ''}
    <div class="insp-sec">
      <div class="hud">Status history</div>
      ${n.history.slice(-7).reverse().map(h =>
        `<div class="hist-row"><span class="adot" style="background:${h.agent ? AGENTS[h.agent].color : 'var(--line-bright)'}"></span><span>${fmtT(h.t)}</span><span class="hv" style="color:${STATUS[h.status].hex}">${h.status}</span></div>`).join('')}
    </div>`;
}

/* ═══════════════ 8 · TICKER ═══════════════ */
const ticker = $('ticker');
function renderTicker(state, T) {
  const recent = EVENTS.filter(e => e.t <= T && e.t > T - 7 && e.type !== 'node.meta').slice(-4);
  ticker.innerHTML = recent.map((e, i, arr) => {
    const pos = arr.length - 1 - i;
    const cls = pos === 0 ? '' : pos === 1 ? 'old' : 'older';
    const isErr = e.type === 'node.status' && (e.status === 'error' || e.status === 'blocked');
    const isConf = e.type === 'conflict';
    const isNote = e.type === 'note';
    const ac = e.agent ? AGENTS[e.agent].color : 'var(--line-bright)';
    let et = e.type.replace('node.', '').replace('edge.upserted', 'edge').replace('agent.', '');
    let msg;
    if (e.type === 'node.status') msg = `${e.key} → <b style="color:${STATUS[e.status].hex}">${e.status}</b>`;
    else if (e.type === 'node.upserted') msg = `+ ${e.key}`;
    else if (e.type === 'edge.upserted') msg = `${e.from} ⇢ ${e.to}`;
    else if (e.type === 'agent.touch') msg = `${e.key} · ${e.action}`;
    else if (e.type === 'claim') msg = `${e.key} — ${e.intent}`;
    else if (e.type === 'release') msg = `${e.key}${e.note ? ' — ' + e.note : ''}`;
    else if (e.type === 'conflict') msg = `${e.key} — ${e.agents.join(' × ')}`;
    else if (e.type === 'note') msg = `on ${e.key}`;
    else msg = e.title || e.note || e.type;
    return `<div class="tick-line ${cls} ${isErr ? 'is-err' : ''} ${isConf ? 'is-conf' : ''} ${isNote ? 'is-note' : ''}">
      <span class="adot" style="background:${isConf ? 'var(--st-blocked)' : ac}"></span>
      <span class="t">${fmtT(e.t)}</span> <span class="et">${isConf ? 'CONTESTED' : et}</span> ${msg}
    </div>`;
  }).reverse().join('');
  $('evNow').textContent = state.applied;
}

/* ═══════════════ 9 · LEGEND + HEADER CHIPS ═══════════════ */
$('legendRamp').innerHTML = ['planned', 'scaffolded', 'wired', 'styled', 'tested', 'shipped']
  .map(k => `<span class="litem"><i style="background:${STATUS[k].hex}"></i>${k}</span>`).join('');
$('legendAlerts').innerHTML =
  `<span class="litem"><i style="background:${STATUS.blocked.hex}"></i>blocked</span>
   <span class="litem"><i style="background:${STATUS.error.hex}"></i>error</span>
   <span class="litem"><i class="oline"></i>claimed</span>
   <span class="litem"><i class="oline-c"></i>contested</span>`;
$('agentChips').innerHTML = Object.entries(AGENTS)
  .map(([k, a]) => `<div class="agent-chip idle" data-agent="${k}" style="--ac:${a.color}"><span class="agent-dot"></span>${k}</div>`).join('');

/* ═══════════════ 10 · SCRUBBER ═══════════════ */
const track = $('track');
$('tEnd').textContent = fmtT(DUR);
$('evTotal').textContent = EVENTS.length;
for (const e of EVENTS) {
  if (['agent.touch', 'node.meta', 'claim', 'release', 'note'].includes(e.type)) continue;
  const tick = document.createElement('div');
  const isErr = e.type === 'node.status' && (e.status === 'error' || e.status === 'blocked');
  tick.className = 'etick' + (e.type === 'conflict' ? ' is-conf' : isErr ? ' is-err' : e.type === 'node.status' ? ' is-status' : '');
  tick.style.left = (e.t / DUR * 100) + '%';
  track.appendChild(tick);
}
let scrubbing = false;
function trackSeek(ev) {
  const r = track.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  seekTo(f * DUR, 'replay');
}
track.addEventListener('mousedown', ev => { scrubbing = true; trackSeek(ev); });
window.addEventListener('mousemove', ev => { if (scrubbing) trackSeek(ev); });
window.addEventListener('mouseup', () => { scrubbing = false; });

/* ═══════════════ 11 · SIM CLOCK ═══════════════ */
let simT = 0, playing = true, speed = 1, mode = 'live';
let lastTick = null, endShownAt = null;

const liveBadge = $('liveBadge'), liveText = $('liveText'), playIcon = $('playIcon');
function setMode(m) {
  mode = m;
  liveBadge.className = 'live-badge ' + (m === 'live' ? 'live' : m === 'paused' ? 'paused' : 'replay');
  liveText.textContent = m === 'live' ? 'LIVE' : m === 'paused' ? 'PAUSED' : 'REPLAY';
  playIcon.innerHTML = playing ? '<path d="M3 2h3v10H3zM8 2h3v10H8z"/>' : '<path d="M3.5 2.2v9.6L11.6 7z"/>';
}
function seekTo(t, m) {
  simT = Math.min(DUR, Math.max(0, t));
  if (m === 'replay') playing = false;
  setMode(m || mode);
  $('endcard').classList.remove('show'); endShownAt = null;
  render(simT);
}
liveBadge.addEventListener('click', () => { playing = true; speed = 1; syncSpeedUI(); setMode('live'); });
$('playBtn').addEventListener('click', () => { playing = !playing; setMode(playing ? (mode === 'paused' ? 'replay' : mode) : 'paused'); });
document.querySelectorAll('.spd').forEach(el => el.addEventListener('click', () => {
  speed = parseFloat(el.dataset.s); syncSpeedUI();
  if (!playing) { playing = true; setMode('replay'); }
}));
function syncSpeedUI() { document.querySelectorAll('.spd').forEach(el => el.classList.toggle('on', parseFloat(el.dataset.s) === speed)); }

function render(T) {
  const state = stateAt(T);
  renderGraph(state, T);
  renderTicker(state, T);
  renderInspector(state);
  $('fill').style.width = (T / DUR * 100) + '%';
  $('playhead').style.left = (T / DUR * 100) + '%';
  $('tNow').textContent = fmtT(T);
}

function tick(now) {
  if (lastTick === null) { lastTick = now; window.__ready = true; render(simT); requestAnimationFrame(tick); return; }
  const dt = (now - lastTick) / 1000; lastTick = now;
  if (playing && !scrubbing) {
    simT = Math.min(DUR, simT + dt * speed);
    if (simT >= DUR) {
      if (mode === 'live') {
        if (endShownAt === null) {
          endShownAt = now;
          const st = stateAt(DUR);
          $('endStats').textContent = `${EVENTS.length} events · ${st.nodes.size} nodes · 3 agents · ${st.conflicts} contested path resolved · ${st.noteCount} notes`;
          $('endcard').classList.add('show');
        }
        const waitLeft = 4 - (now - endShownAt) / 1000;
        $('endCountdown').textContent = `replaying in ${Math.max(0, waitLeft).toFixed(0)}s — or scrub the timeline`;
        if (waitLeft <= 0 && !window.__recording) { seekTo(0, 'live'); playing = true; setMode('live'); }
      } else { playing = false; setMode('paused'); }
    }
    render(simT);
  }
  requestAnimationFrame(tick);
}

/* ═══════════════ 12 · PAN / ZOOM ═══════════════ */
const viewport = $('viewport'), world = $('world');
let view = { x: 0, y: 0, k: 1 };
function applyView() { world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`; }
function fitView() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const k = Math.min((vw - 60) / WORLD.w, (vh - 90) / WORLD.h, 1.2);
  view.k = k;
  view.x = (vw - WORLD.w * k) / 2 - WORLD.ox * k + 10;
  view.y = (vh - WORLD.h * k) / 2 - WORLD.oy * k;
  applyView();
}
$('fitBtn').addEventListener('click', fitView);
let panning = null;
viewport.addEventListener('mousedown', ev => {
  if (ev.target.closest('.node') || ev.target.closest('#legend')) return;
  panning = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', ev => {
  if (!panning) return;
  view.x = panning.vx + (ev.clientX - panning.x);
  view.y = panning.vy + (ev.clientY - panning.y);
  applyView();
});
window.addEventListener('mouseup', () => { panning = null; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', ev => {
  ev.preventDefault();
  const k0 = view.k;
  const k = Math.min(2.2, Math.max(0.35, k0 * (ev.deltaY < 0 ? 1.09 : 0.92)));
  const r = viewport.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  view.x = mx - (mx - view.x) * (k / k0);
  view.y = my - (my - view.y) * (k / k0);
  view.k = k;
  applyView();
}, { passive: false });
window.addEventListener('resize', fitView);

/* ═══════════════ 13 · BOOT + self-check ═══════════════ */
window.__seek = t => { seekTo(t, 'replay'); };
(function selfCheck() {
  const a = stateAt(40), b = stateAt(40);
  console.assert(a.nodes.size === b.nodes.size && a.applied === b.applied, 'reducer not deterministic');
  const end = stateAt(DUR);
  console.assert(end.nodes.size === 13, 'expected 13 nodes at end, got', end.nodes.size);
  console.assert(end.claims.size === 0, 'expected all claims released at end');
  console.assert(stateAt(31).claims.get('apiIntent')?.length === 2, 'expected contested apiIntent at t=31');
  console.log(`%cDEV PATHS v2 OK — ${EVENTS.length} events · ${end.nodes.size} nodes · ${end.conflicts} conflict · ${end.noteCount} notes`, 'color:#22B8E6');
})();
document.fonts.ready.then(() => {
  fitView();
  render(0);
  setMode('live');
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
