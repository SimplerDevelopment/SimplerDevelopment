version: 2
updates:
  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  # Bun manifest (package.json + bun.lock). Uses Dependabot's native bun
  # ecosystem so bumps update bun.lock too — avoids `bun install --frozen-lockfile`
  # failures on Dependabot PRs.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # The @types/node major must track the runtime Node major (22, see
      # package.json engines.node and CI node-version). A newer types major
      # would let code call Node APIs that production does not have. Bump this
      # by hand, together with the runtime, never via Dependabot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
